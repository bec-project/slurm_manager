name: Ruff
on: [workflow_call]
jobs:
  Ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check imports and lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
