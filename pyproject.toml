[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bec-slurm-manager"
version = "1.0.0"
description = "A tool for managing slurm jobs."
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic~=2.12.0",
    "redis[hiredis]>=6.2, <9.0",
    "python-dotenv~=1.2",
]

[project.optional-dependencies]
dev = [
    "coverage~=7.0",
    "pytest~=8.0",
    "ruff~=0.17.1",
    "pytest-random-order~=1.1",
    "fakeredis~=2.23, >=2.23.2",
]

[project.scripts]

[project.urls]
"Bug Tracker" = "https://github.com/bec-project/slurm_manager/issues"
Homepage = "https://github.com/bec-project/slurm_manager"
changelog = "https://github.com/bec-project/slurm_manager/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"test/**" = ["PL"]

[tool.semantic_release]
build_command = "python -m build"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = true

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.coverage.report]
skip_empty = true # exclude empty *files*, e.g. __init__.py, from the report
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "return NotImplemented",
    "raise NotImplementedError",
    "\\.\\.\\.",
    'if __name__ == "__main__":',
]
